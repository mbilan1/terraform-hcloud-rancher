name: "SAST: tfsec"

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tfsec:
    name: tfsec scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        # WORKAROUND: tfsec can't parse OpenTofu check{} blocks (parse error ignores --soft-fail).
        # tfsec is deprecated — Aqua recommends Trivy. We keep it for coverage overlap.
        continue-on-error: true
        with:
          soft_fail: true
