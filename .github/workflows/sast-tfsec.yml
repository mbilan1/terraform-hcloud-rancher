name: "SAST: tfsec"

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  tfsec:
    name: tfsec scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.3
        # WORKAROUND: tfsec can't parse OpenTofu check{} blocks (parse error ignores --soft-fail).
        # tfsec is deprecated — Aqua recommends Trivy. We keep it for coverage overlap.
        continue-on-error: true
        with:
          soft_fail: true
